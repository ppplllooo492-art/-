<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ULTRA MC STUDIO v4.0</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Noto Sans Thai', sans-serif;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
        }

        .neon-glow {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #020617;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- =========================
         TOP NAVIGATION
    ========================== -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">

        <div class="flex items-center gap-3">

            <div class="bg-gradient-to-tr from-purple-600 to-pink-500 p-2.5 rounded-xl shadow-lg shadow-purple-500/20">
                <i data-lucide="layers" class="w-6 h-6 text-white"></i>
            </div>

            <div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">
                    ULTRA MC STUDIO
                </h1>

                <p class="text-xs text-slate-400 font-medium tracking-wide code-font">
                    v4.0 // QUANTUM COMPILER
                </p>
            </div>

        </div>

        <!-- PLATFORM SWITCH -->
        <div class="flex bg-slate-950 border border-slate-800 rounded-xl p-1">

            <button
                id="platform-bedrock"
                onclick="setPlatform('bedrock')"
                class="px-4 py-2 text-sm font-semibold rounded-lg transition-all flex items-center gap-2 bg-gradient-to-r from-purple-600 to-pink-500 text-white shadow-md">

                <i data-lucide="smartphone" class="w-4 h-4"></i>
                Bedrock (.mcpack)

            </button>

            <button
                id="platform-java"
                onclick="setPlatform('java')"
                class="px-4 py-2 text-sm font-semibold rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">

                <i data-lucide="monitor" class="w-4 h-4"></i>
                Java Edition (.zip)

            </button>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden max-h-[calc(100vh-73px)]">

        <!-- =========================
             LEFT SIDEBAR
        ========================== -->

        <section class="lg:col-span-4 border-r border-slate-800 p-6 flex flex-col gap-6 overflow-y-auto bg-slate-900/30">

            <!-- PROJECT SETTINGS -->

            <div>

                <h2 class="text-xs font-bold uppercase tracking-widest text-purple-400 mb-4 flex items-center gap-2">

                    <i data-lucide="sliders" class="w-4 h-4"></i>

                    สถาปัตยกรรมแอดออน

                </h2>


                <div class="space-y-4">

                    <!-- NAME -->

                    <div>

                        <label class="block text-xs font-medium text-slate-400 mb-1.5">
                            ชื่อโปรเจกต์ / แอดออน
                        </label>

                        <input
                            type="text"
                            id="pack-name"
                            value="MyEpicAddon"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 code-font">

                    </div>


                    <!-- DESCRIPTION -->

                    <div>

                        <label class="block text-xs font-medium text-slate-400 mb-1.5">
                            คำอธิบายรายละเอียด
                        </label>

                        <textarea
                            id="pack-desc"
                            rows="2"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500">สร้างโดยระบบอัตโนมัติ ULTRA MC STUDIO v4.0</textarea>

                    </div>


                    <!-- VERSION + NAMESPACE -->

                    <div class="grid grid-cols-2 gap-3">

                        <div>

                            <label class="block text-xs font-medium text-slate-400 mb-1.5">
                                เวอร์ชันแอดออน
                            </label>

                            <input
                                type="text"
                                id="pack-version"
                                value="1.0.0"
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-center focus:outline-none focus:border-purple-500 code-font">

                        </div>


                        <div>

                            <label class="block text-xs font-medium text-slate-400 mb-1.5">
                                Namespace
                            </label>

                            <input
                                type="text"
                                id="pack-namespace"
                                value="custom_mod"
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-center focus:outline-none focus:border-purple-500 code-font">

                        </div>

                    </div>

                </div>

            </div>


            <hr class="border-slate-800">


            <!-- =========================
                 TEMPLATES
            ========================== -->

            <div>

                <h2 class="text-xs font-bold uppercase tracking-widest text-pink-400 mb-3 flex items-center gap-2">

                    <i data-lucide="wand-2" class="w-4 h-4"></i>

                    พิมพ์เขียวตัวอย่างโค้ด

                </h2>

                <p class="text-xs text-slate-400 mb-3">
                    กดเลือกแม่แบบเพื่อโหลดโค้ดตัวอย่าง
                </p>


                <div class="grid grid-cols-1 gap-2">

                    <!-- ITEM -->

                    <button
                        onclick="loadTemplate('item')"
                        class="group flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded-xl text-left hover:border-pink-500/50 transition-all">

                        <div class="flex items-center gap-3">

                            <div class="p-2 bg-pink-500/10 rounded-lg text-pink-400">
                                <i data-lucide="sword" class="w-4 h-4"></i>
                            </div>

                            <div>

                                <h4 class="text-xs font-bold">
                                    ดาบมหาเวทย์
                                </h4>

                                <p class="text-[10px] text-slate-500 code-font">
                                    minecraft:item
                                </p>

                            </div>

                        </div>

                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>

                    </button>


                    <!-- BLOCK -->

                    <button
                        onclick="loadTemplate('block')"
                        class="group flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded-xl text-left hover:border-purple-500/50 transition-all">

                        <div class="flex items-center gap-3">

                            <div class="p-2 bg-purple-500/10 rounded-lg text-purple-400">
                                <i data-lucide="box" class="w-4 h-4"></i>
                            </div>

                            <div>

                                <h4 class="text-xs font-bold">
                                    บล็อกแร่ควอนตัม
                                </h4>

                                <p class="text-[10px] text-slate-500 code-font">
                                    minecraft:block
                                </p>

                            </div>

                        </div>

                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>

                    </button>

                </div>

            </div>


            <!-- =========================
                 DOWNLOAD BUTTON
            ========================== -->

            <div class="mt-auto pt-4">

                <button
                    onclick="compileAndDownload()"
                    class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 hover:opacity-90 active:scale-[0.98] text-white font-bold py-4 px-6 rounded-xl shadow-lg neon-glow transition-all flex items-center justify-center gap-3">

                    <i data-lucide="download-cloud" class="w-5 h-5"></i>

                    ประกอบและดาวน์โหลด ZIP

                </button>

            </div>

        </section>


        <!-- =========================
             RIGHT WORKSPACE
        ========================== -->

        <section class="lg:col-span-8 flex flex-col h-full overflow-hidden bg-slate-950">


            <!-- EDITOR HEADER -->

            <div class="border-b border-slate-800 bg-slate-900/40 px-6 py-3 flex items-center justify-between">

                <div class="flex items-center gap-2">

                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>

                    <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">
                        กล่องรับข้อมูลโค้ด
                    </span>

                </div>


                <button
                    onclick="clearEditor()"
                    class="text-xs text-slate-500 hover:text-rose-400 transition-colors flex items-center gap-1">

                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>

                    ล้างข้อมูล

                </button>

            </div>


            <!-- CODE EDITOR -->

            <div class="flex-1 relative overflow-hidden">

                <textarea
                    id="code-input"
                    class="w-full h-full bg-slate-950 px-6 py-4 text-sm text-emerald-400 code-font focus:outline-none resize-none leading-relaxed"
                    placeholder="// วาง JSON หรือโค้ดของ Minecraft ที่นี่..."></textarea>

            </div>


            <!-- =========================
                 CONSOLE
            ========================== -->

            <div class="h-48 border-t border-slate-800 bg-slate-900/60 flex flex-col">

                <div class="px-6 py-2 border-b border-slate-800 bg-slate-950/80 flex items-center justify-between">

                    <div class="flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-widest">

                        <i data-lucide="terminal" class="w-4 h-4"></i>

                        Quantum Console

                    </div>

                    <span class="text-[10px] text-emerald-400">
                        ENGINE ONLINE
                    </span>

                </div>


                <div
                    id="console-logs"
                    class="flex-1 overflow-y-auto px-6 py-3 text-xs code-font space-y-1">

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // Initialize icons
        lucide.createIcons();


        // Current platform
        let currentPlatform = "bedrock";


        // ==========================================
        // TEMPLATES
        // ==========================================

        const templates = {

            item: {

                bedrock: {
                    format_version: "1.20.10",

                    "minecraft:item": {

                        description: {

                            identifier: "custom_mod:magic_sword",

                            menu_category: {
                                category: "equipment"
                            }

                        },

                        components: {

                            "minecraft:icon": "magic_sword",

                            "minecraft:display_name": {
                                value: "§bดาบจอมเวทย์ควอนตัม"
                            },

                            "minecraft:damage": 12,

                            "minecraft:hand_equipped": true,

                            "minecraft:max_stack_size": 1

                        }

                    }

                },


                java: {

                    item_type: "minecraft:sword",

                    display_name: "Magic Quantum Sword",

                    attributes: {

                        attack_damage: 12.0,

                        attack_speed: 1.6

                    },

                    lore: [
                        "ดาบเวทมนตร์โบราณที่ประจุพลังงานสูง"
                    ]

                }

            },


            block: {

                bedrock: {

                    format_version: "1.20.10",

                    "minecraft:block": {

                        description: {

                            identifier: "custom_mod:quantum_ore"

                        },

                        components: {

                            "minecraft:destroy_time": 3.0,

                            "minecraft:explosion_resistance": 6.0,

                            "minecraft:light_emission": 5

                        }

                    }

                },


                java: {

                    block_type: "minecraft:ore",

                    block_name: "Quantum Ore",

                    hardness: 3.0,

                    resistance: 6.0,

                    light_level: 5,

                    loot_table: "custom_mod:blocks/quantum_ore"

                }

            }

        };


        // ==========================================
        // PLATFORM SWITCH
        // ==========================================

        function setPlatform(platform) {

            currentPlatform = platform;

            const bedrockButton =
                document.getElementById("platform-bedrock");

            const javaButton =
                document.getElementById("platform-java");


            const activeClass =
                "px-4 py-2 text-sm font-semibold rounded-lg transition-all flex items-center gap-2 bg-gradient-to-r from-purple-600 to-pink-500 text-white shadow-md";


            const inactiveClass =
                "px-4 py-2 text-sm font-semibold rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200";


            if (platform === "bedrock") {

                bedrockButton.className = activeClass;

                javaButton.className = inactiveClass;

                logToConsole(
                    "สลับแพลตฟอร์มเป็น [Bedrock Edition]"
                );

            } else {

                javaButton.className = activeClass;

                bedrockButton.className = inactiveClass;

                logToConsole(
                    "สลับแพลตฟอร์มเป็น [Java Edition]"
                );

            }

        }


        // ==========================================
        // LOAD TEMPLATE
        // ==========================================

        function loadTemplate(type) {

            const template =
                templates[type][currentPlatform];


            if (!template) {

                logToConsole(
                    "ไม่พบแม่แบบที่เลือก",
                    "error"
                );

                return;
            }


            document.getElementById("code-input").value =
                JSON.stringify(template, null, 2);


            logToConsole(
                `โหลดแม่แบบ [${type.toUpperCase()}] สำเร็จ`,
                "success"
            );

        }


        // ==========================================
        // CLEAR EDITOR
        // ==========================================

        function clearEditor() {

            document.getElementById("code-input").value = "";

            logToConsole(
                "ล้างพื้นที่โค้ดเรียบร้อย",
                "info"
            );

        }


        // ==========================================
        // CONSOLE LOGGER
        // ==========================================

        function logToConsole(message, type = "info") {

            const consoleBox =
                document.getElementById("console-logs");


            const time =
                new Date().toLocaleTimeString();


            let colorClass =
                "text-slate-400";


            if (type === "success") {

                colorClass =
                    "text-emerald-400 font-bold";

            }


            if (type === "error") {

                colorClass =
                    "text-rose-400 font-bold";

            }


            if (type === "process") {

                colorClass =
                    "text-amber-400";

            }


            const line =
                document.createElement("div");


            line.className = colorClass;


            line.textContent =
                `> [${time}] ${message}`;


            consoleBox.appendChild(line);


            consoleBox.scrollTop =
                consoleBox.scrollHeight;

        }


        // ==========================================
        // UUID
        // ==========================================

        function generateUUID() {

            return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
                .replace(/[xy]/g, function(c) {

                    const r =
                        Math.random() * 16 | 0;

                    const v =
                        c === "x"
                            ? r
                            : (r & 0x3 | 0x8);

                    return v.toString(16);

                });

        }


        // ==========================================
        // VERSION PARSER
        // ==========================================

        function parseVersion(version) {

            const numbers =
                version
                    .split(".")
                    .map(Number)
                    .filter(Number.isFinite);


            if (numbers.length === 3) {

                return numbers;

            }


            return [1, 0, 0];

        }


        // ==========================================
        // SAFE FILE NAME
        // ==========================================

        function safeFileName(name) {

            return name
                .replace(/[<>:"/\\|?*]/g, "_")
                .replace(/\s+/g, "_");

        }


        // ==========================================
        // COMPILE
        // ==========================================

        async function compileAndDownload() {

            const rawCode =
                document
                    .getElementById("code-input")
                    .value
                    .trim();


            const packName =
                document
                    .getElementById("pack-name")
                    .value
                    .trim() ||
                "EpicModPack";


            const packDesc =
                document
                    .getElementById("pack-desc")
                    .value
                    .trim() ||
                "Generated by Ultra MC Studio";


            const packVersion =
                document
                    .getElementById("pack-version")
                    .value
                    .trim() ||
                "1.0.0";


            const namespace =
                document
                    .getElementById("pack-namespace")
                    .value
                    .trim()
                    .replace(/[^a-zA-Z0-9_]/g, "_") ||
                "custom";


            // Check JSZip

            if (typeof JSZip === "undefined") {

                logToConsole(
                    "ไม่พบ JSZip กรุณาตรวจสอบอินเทอร์เน็ต",
                    "error"
                );

                alert(
                    "ไม่สามารถโหลด JSZip ได้"
                );

                return;

            }


            // Check empty code

            if (!rawCode) {

                logToConsole(
                    "ไม่พบโค้ดสำหรับคอมไพล์",
                    "error"
                );

                alert(
                    "กรุณาวางโค้ดก่อนทำการคอมไพล์ครับ!"
                );

                return;

            }


            logToConsole(
                "เริ่มกระบวนการคอมไพล์...",
                "process"
            );


            const zip =
                new JSZip();


            const finalVersion =
                parseVersion(packVersion);


            // ======================================
            // BEDROCK
            // ======================================

            if (currentPlatform === "bedrock") {

                logToConsole(
                    "กำลังสร้างโครงสร้าง Bedrock...",
                    "process"
                );


                const manifest = {

                    format_version: 2,

                    header: {

                        description: packDesc,

                        name: packName,

                        uuid: generateUUID(),

                        version: finalVersion,

                        min_engine_version: [1, 20, 0]

                    },

                    modules: [

                        {

                            description: packDesc,

                            type: "data",

                            uuid: generateUUID(),

                            version: finalVersion

                        }

                    ]

                };


                zip.file(
                    "manifest.json",
                    JSON.stringify(
                        manifest,
                        null,
                        2
                    )
                );


                logToConsole(
                    "สร้าง manifest.json สำเร็จ",
                    "success"
                );


                // Try JSON validation

                let parsedCode = null;


                try {

                    parsedCode =
                        JSON.parse(rawCode);

                } catch (error) {

                    logToConsole(
                        "โค้ดไม่ใช่ JSON ที่ถูกต้อง ระบบจะเก็บเป็นไฟล์ raw",
                        "error"
                    );

                }


                // ITEM

                if (
                    rawCode.includes("minecraft:item")
                ) {

                    zip.file(
                        "items/custom_item.json",
                        rawCode
                    );


                    logToConsole(
                        "ตรวจพบ ITEM → items/custom_item.json",
                        "success"
                    );

                }


                // BLOCK

                else if (
                    rawCode.includes("minecraft:block")
                ) {

                    zip.file(
                        "blocks/custom_block.json",
                        rawCode
                    );


                    logToConsole(
                        "ตรวจพบ BLOCK → blocks/custom_block.json",
                        "success"
                    );

                }


                // UNKNOWN

                else {

                    zip.file(
                        "structures/raw_injected_code.json",
                        rawCode
                    );


                    logToConsole(
                        "ไม่สามารถระบุประเภท → เก็บเป็น raw_injected_code.json",
                        "process"
                    );

                }


                // Add README

                zip.file(
                    "README.txt",
                    [
                        packName,
                        "",
                        packDesc,
                        "",
                        `Version: ${packVersion}`,
                        `Namespace: ${namespace}`,
                        "Platform: Minecraft Bedrock Edition",
                        "",
                        "Generated by ULTRA MC STUDIO v4.0"
                    ].join("\n")
                );

            }


            // ======================================
            // JAVA
            // ======================================

            else {

                logToConsole(
                    "กำลังสร้างโครงสร้าง Java...",
                    "process"
                );


                const packMcmeta = {

                    pack: {

                        description: packDesc,

                        pack_format: 15

                    }

                };


                zip.file(
                    "pack.mcmeta",
                    JSON.stringify(
                        packMcmeta,
                        null,
                        2
                    )
                );


                logToConsole(
                    "สร้าง pack.mcmeta สำเร็จ",
                    "success"
                );


                const basePath =
                    `data/${namespace}/`;


                if (
                    rawCode.toLowerCase().includes("item") ||
                    rawCode.toLowerCase().includes("sword")
                ) {

                    zip.file(
                        `${basePath}items/custom_item.json`,
                        rawCode
                    );


                    logToConsole(
                        `ตรวจพบ ITEM → ${basePath}items/custom_item.json`,
                        "success"
                    );

                } else {

                    zip.file(
                        `${basePath}worldgen/custom_data.json`,
                        rawCode
                    );


                    logToConsole(
                        `บันทึกข้อมูล → ${basePath}worldgen/custom_data.json`,
                        "success"
                    );

                }


                zip.file(
                    "README.txt",
                    [
                        packName,
                        "",
                        packDesc,
                        "",
                        `Version: ${packVersion}`,
                        `Namespace: ${namespace}`,
                        "Platform: Minecraft Java Edition",
                        "",
                        "Generated by ULTRA MC STUDIO v4.0"
                    ].join("\n")
                );

            }


            // ======================================
            // GENERATE ZIP
            // ======================================

            logToConsole(
                "กำลังบีบอัดไฟล์ ZIP...",
                "process"
            );


            try {

                const content =
                    await zip.generateAsync({
                        type: "blob"
                    });


                const url =
                    URL.createObjectURL(content);


                const element =
                    document.createElement("a");


                element.href = url;


                element.download =
                    `${safeFileName(packName)}_ReadyToUse.zip`;


                document.body.appendChild(
                    element
                );


                element.click();


                document.body.removeChild(
                    element
                );


                setTimeout(() => {

                    URL.revokeObjectURL(url);

                }, 1000);


                logToConsole(
                    `ส่งออก ${packName}_ReadyToUse.zip สำเร็จ!`,
                    "success"
                );


                alert(
                    "คอมไพล์เสร็จแล้ว! ไฟล์ ZIP ถูกดาวน์โหลดเรียบร้อย"
                );


            } catch (error) {

                console.error(error);


                logToConsole(
                    `เกิดข้อผิดพลาด: ${error.message}`,
                    "error"
                );


                alert(
                    "เกิดข้อผิดพลาดระหว่างสร้างไฟล์ ZIP"
                );

            }

        }


        // ==========================================
        // STARTUP
        // ==========================================

        window.addEventListener(
            "load",
            function() {

                logToConsole(
                    "ระบบพร้อมสแตนด์บาย",
                    "success"
                );

                logToConsole(
                    "ULTRA MC STUDIO v4.0 ENGINE ONLINE"
                );

                logToConsole(
                    "เลือกแพลตฟอร์มและวางโค้ดเพื่อเริ่มต้น"
                );

            }
        );

    </script>

</body>
</html>
